# docker-compose.yml — Gemma 4 12B MTP test stack
#
# Four containers comparing llama.cpp with/without Multi-Token Prediction
# (MTP) against Ollama, all on the same Gemma 4 12B model (Q4_K_XL).
#
#   docker compose pull && docker compose up -d       Normal operation — starts
#                                                      llama-mtp, ollama, open-webui
#   docker compose --profile iso up -d llama-base      Reference phase of the benchmark
#
# llama-base sits in the "iso" profile and does not run in normal operation; the
# benchmark script (bench_iso.py) brings it up and down on purpose.

services:

  # llama.cpp WITH MTP — the test bench.
  llama-mtp:
    container_name: llama-mtp
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    ports: ["8080:8080"]
    volumes:
      - ./models:/models
    command: >
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --model-draft /models/mtp-gemma-4-12B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      -ngl 999 -fa on
      -c 8192
      --host 0.0.0.0 --port 8080
    restart: unless-stopped

  # llama.cpp WITHOUT MTP — reference. Only active with "--profile iso", so that
  # two 12B instances are never in VRAM at the same time.
  llama-base:
    container_name: llama-base
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    ports: ["8081:8080"]
    volumes:
      - ./models:/models
    command: >
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      -ngl 999 -fa on
      -c 8192
      --host 0.0.0.0 --port 8080
    restart: unless-stopped
    profiles: ["iso"]

  # Ollama — the same Q4_K_XL model, for the stack comparison.
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    gpus: all
    ports: ["11434:11434"]
    volumes:
      - ./ollama:/root/.ollama
      # Access to the same GGUF as llama.cpp, for the model import (3.6).
      - ./models:/models:ro
    restart: unless-stopped

  # Shared chat UI for the subjective test (4.1).
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    ports: ["3000:8080"]
    environment:
      - OPENAI_API_BASE_URL=http://llama-mtp:8080/v1
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./openwebui:/app/backend/data
    depends_on: [llama-mtp, ollama]
    restart: unless-stopped
