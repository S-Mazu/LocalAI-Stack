# docker-compose.yml — Local LLM Stack
#
# This file describes all six containers. A single command starts them
# together:  docker compose up -d
#
# Recurring terms:
#   image           Template a container is created from. Docker downloads it
#                   automatically on first start.
#   container_name  Name of the running container. Also the name the other
#                   containers use to reach it on the internal network.
#   ports           "outside:inside" — makes a container port reachable on the
#                   Windows machine.
#   volumes         Persistent storage. Without it all data would be gone as
#                   soon as a container is recreated.
#   environment     Settings the container reads at start.
#   depends_on      Start order.
#   restart         "unless-stopped" = starts automatically with Windows.
#
# Compose creates a shared network automatically. On it the containers reach
# each other by their name, for example http://inference:11434
# From the Windows machine those names do not work — that is what the ports
# entries and the proxy container are for.

services:

  # Language models. The only container that runs on the graphics card.
  inference:
    container_name: inference
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      # The downloaded models live here, several gigabytes.
      - inference:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            # Passes the NVIDIA graphics card through into the container.
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Turns uploaded PDFs into structured text.
  # Needs no persistent storage: it only processes and returns.
  extraction:
    container_name: extraction
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    ports: ["5001:5001"]
    environment:
      # Enables the built-in test interface.
      - DOCLING_SERVE_ENABLE_UI=1
    restart: unless-stopped

  # Translates the MCP tools into an interface Open WebUI understands.
  tools:
    container_name: tools
    image: ghcr.io/open-webui/mcpo:main
    ports: ["8000:8000"]
    volumes:
      # The configuration file from the Windows folder, read-only (:ro).
      - ./tools:/config:ro
      # Storage for the memory tool's memory.
      - tools:/data
    command: ["--config", "/config/config.json", "--hot-reload"]
    restart: unless-stopped

  # The chat interface. Also contains document search.
  chat:
    container_name: chat
    image: ghcr.io/open-webui/open-webui:main
    # 8080 inside, 3000 outside.
    ports: ["3000:8080"]
    environment:
      - OLLAMA_BASE_URL=http://inference:11434
    sysctls:
      # WSL2 ships a very narrow ephemeral port range and holds closed ports
      # in TIME_WAIT for two minutes. chat opens many outbound connections to
      # inference, extraction and tools and runs out of ports. These two
      # widen the range and allow reuse of TIME_WAIT sockets.
      - net.ipv4.ip_local_port_range=10240 65535
      - net.ipv4.tcp_tw_reuse=1
    volumes:
      # Accounts, chats, settings, vectors and the reranker model.
      - chat:/app/backend/data
    depends_on: [inference, extraction, tools]
    restart: unless-stopped

  # Workflow automation.
  automation:
    container_name: automation
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      # These three switch telemetry off. Without them model calls on Windows
      # are delayed by minutes.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - EXTERNAL_FRONTEND_HOOKS_URLS=
    volumes:
      # Workflows and credentials.
      - automation:/home/node/.n8n
    restart: unless-stopped

  # Makes the containers reachable by name instead of by port.
  proxy:
    container_name: proxy
    image: caddy:latest
    ports: ["80:80"]
    volumes:
      # The whole folder, not the single file — the image requires it this way.
      - ./proxy:/etc/caddy
      - proxy:/data
    # Enabling an optional service below: add its name to this list.
    depends_on: [inference, chat, extraction, tools, automation]
    restart: unless-stopped

  # --- Optional: Portainer (README 5.2) ---
  # Web interface for all containers: status, logs, console, restart, resource
  # usage. Remove the leading # from the block below to enable it.
  #
  # The /var/run/docker.sock mount gives Portainer full control over the
  # Docker engine and therefore over the machine — do not expose the
  # interface to the network.
  #
  # management:
  #   container_name: management
  #   image: portainer/portainer-ce:lts
  #   # Without --http-enabled Portainer serves HTTPS on 9443 only.
  #   command: --http-enabled
  #   ports: ["9000:9000"]
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - management:/data
  #   restart: unless-stopped

  # --- Optional: Open Terminal (README 5.3) ---
  # Gives the model in chat a shell and a file system. Remove the leading #
  # from the block below to enable it.
  #
  # The shell sees this container's file system and nothing else. Mounting the
  # Docker socket would hand the model the machine — deliberately not set.
  #
  # shell:
  #   container_name: shell
  #   image: ghcr.io/open-webui/open-terminal:latest
  #   # 8010 outside because tools already holds 8000. Inside it stays 8000.
  #   ports: ["8010:8000"]
  #   environment:
  #     - OPEN_TERMINAL_API_KEY=<key of your choice>
  #   volumes:
  #     - shell:/home/user
  #   restart: unless-stopped

  # --- Optional: InvokeAI (README 5.4) ---
  # Image generation and editing with its own interface. Remove the leading #
  # from the block below to enable it.
  #
  # Shares the graphics card with inference — README 5.4 covers freeing the
  # memory before generating.
  #
  # images:
  #   container_name: images
  #   image: ghcr.io/invoke-ai/invokeai:latest
  #   ports: ["9090:9090"]
  #   environment:
  #     - INVOKEAI_ROOT=/invokeai
  #     - HF_HOME=/invokeai/.cache/huggingface
  #     - HUGGING_FACE_HUB_TOKEN=<token from README 5.4, step 1>
  #   volumes:
  #     - images:/invokeai
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

# Named storage areas. Docker manages them itself; they survive recreating the
# containers and are only deleted by "docker compose down -v".
volumes:
  inference:
  chat:
  automation:
  tools:
  proxy:
  # Optional services (README 5.2-5.4): remove the leading # to enable.
  # management:
  # shell:
  # images:
